name: Перевірка розгортання Ride Sharing

on:
  push:
    tags:
      - 'lr6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demonstration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Збірка та запуск API
        env:
          DEMO_REPEAT_EVENTS: "true"
        run: docker compose up --build -d
      - name: Запит, два споживачі та повторна доставка
        run: |
          set -o pipefail
          python3 tools/verify_events.py --compose --url http://127.0.0.1:8080 | tee evidence-compose.txt
      - name: Журнал контейнера
        if: always()
        run: docker compose logs --no-color backend-api
      - name: Збереження результату
        uses: actions/upload-artifact@v4
        with:
          name: compose-demonstration
          path: evidence-compose.txt
          if-no-files-found: warn
      - name: Зупинка стенда
        if: always()
        run: docker compose down
